name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run linting
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Run tests
              run: npm test -- --run

            - name: Build project
              run: npm run build

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Start gateway
              run: docker compose -f e2e/docker-compose.yml up -d

            # A second stack, on its own port: the rosbag specs need a fault
            # manager to own the recordings, which the scripts stack does not run.
            - name: Start rosbag gateway
              run: docker compose -f e2e/docker-compose.rosbag.yml up -d

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            # The rosbag specs skip themselves when the fixture is not there, so
            # without this the job stays green whether or not they ever ran.
            - name: Wait for the rosbag fixture
              run: ./e2e/wait-for-rosbag-fixture.sh

            - name: Run E2E tests
              run: npm run test:e2e

            - name: Upload Playwright artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/

            - name: Dump gateway logs on failure
              if: failure()
              run: docker compose -f e2e/docker-compose.yml logs

            - name: Dump rosbag gateway logs on failure
              if: failure()
              run: docker compose -f e2e/docker-compose.rosbag.yml logs

            - name: Stop gateway
              if: always()
              run: docker compose -f e2e/docker-compose.yml down -v

            # -v matters here: the volume holds faults.db as well as the bags, so
            # a reused one starts with the fault already confirmed and seeds a
            # different number of recordings than a clean run.
            - name: Stop rosbag gateway
              if: always()
              run: docker compose -f e2e/docker-compose.rosbag.yml down -v

    docker-build:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              run: docker build -t ros2_medkit_web_ui:test -f Dockerfile .
